<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heads Up</title>
<style>
:root{--bg:#262421;--fg:#ffffff;--muted:#a9a7a3;--card:#312e2b;--line:#43403c;--ok:#95bb4a;--okbg:#3a5224;--pass:#f0a24b;--passbg:#54401f;--accent:#81b64c;--accentbg:#3d4a2c;--btn:#81b64c;--btntext:#ffffff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:ui-rounded,"Nunito","Trebuchet MS",system-ui,sans-serif;overflow:hidden}
#stage{height:100%;width:100%;transition:background .15s}
#stage.ok{background:var(--okbg)}#stage.pass{background:var(--passbg)}
@media (orientation:portrait){body.playing #stage{position:fixed;top:0;left:100%;width:100dvh;height:100dvw;transform-origin:top left;transform:rotate(90deg)}}
.scr{display:none;height:100%;box-sizing:border-box;flex-direction:column;padding:12px 16px}
.scr.on{display:flex}
#home{overflow-y:auto;align-items:center;justify-content:flex-start;text-align:center;gap:14px}#home>:first-child{margin-top:auto}#home>:last-child{margin-bottom:auto}
h1{font-size:44px;margin:0;letter-spacing:-.02em}
.sub{margin:0;max-width:30ch;color:var(--muted);font-size:16px;line-height:1.4}
#decks{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,420px)}
button{font:inherit;cursor:pointer;border:0;border-radius:16px}
.deck{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);color:var(--fg);border:2px solid var(--line);font-size:16px;font-weight:700;text-align:left}
.deck span{font-size:26px}
.deck:active{border-color:var(--accent)}
#ready,#end{align-items:center;justify-content:center;text-align:center;gap:8px}
#count{font-size:min(40cqh,150px);font-size:120px;font-weight:800;color:var(--accent);line-height:1}
.bar{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:24px;padding:0 4px 8px}
.bar small{font-size:14px;color:var(--muted);font-weight:700}
#card{flex:1;min-height:0;container-type:size;display:flex;align-items:center;gap:4cqw;padding:0 4cqw;background:var(--card);border:2px solid var(--line);border-radius:22px}
.pic{height:78cqh;aspect-ratio:1;flex-shrink:0;border-radius:18px;background:var(--accentbg);display:flex;align-items:center;justify-content:center;font-size:48cqh;line-height:1}
.word{flex:1;min-width:0;font-weight:800;line-height:1.05;overflow-wrap:anywhere}
.foot{display:flex;gap:10px;padding-top:8px}
.foot button{flex:1;height:44px;font-weight:800;font-size:17px}
.b-pass{background:var(--passbg);color:var(--pass)}
.b-ok{background:var(--okbg);color:var(--ok)}
.go{background:var(--btn);color:var(--btntext);padding:14px 26px;font-weight:800;font-size:18px}
.ghost{background:transparent;color:var(--accent);padding:14px 20px;font-weight:700;font-size:16px}
#final{font-size:72px;font-weight:800;color:var(--accent);line-height:1}
#log{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px;max-height:84px;overflow-y:auto}
.chip{padding:4px 10px;border-radius:99px;font-size:14px;font-weight:700}
.chip.y{background:var(--okbg);color:var(--ok)}.chip.n{background:var(--passbg);color:var(--pass)}
.row{display:flex;gap:8px;margin-top:6px}
.opts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.opt{padding:8px 14px;background:var(--card);color:var(--muted);border:2px solid var(--line);font-weight:800;font-size:15px}
.opt.sel{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div id="stage">
  <section id="home" class="scr on">
    <h1>Heads Up</h1>
    <p class="sub">Hold the phone on your forehead. Your friends act out the word. Tilt down for correct, up to pass.</p>
    <div class="opts"><button class="opt" data-t="30">30s</button><button class="opt sel" data-t="60">60s</button><button class="opt" data-t="90">90s</button><button class="opt sel" id="snd">Sound on</button></div>
    <div id="decks"></div>
  </section>
  <section id="ready" class="scr">
    <p class="sub">Put the phone on your forehead</p>
    <div id="count">3</div><p class="sub" id="tilt"></p>
  </section>
  <section id="game" class="scr">
    <div class="bar"><span id="time">60</span><small id="deckname"></small><span id="score">0</span></div>
    <div id="card"><div class="pic" id="pic"></div><div class="word" id="word"></div></div>
    <div class="foot"><button class="b-pass" id="bp">Pass</button><button class="b-ok" id="bo">Correct</button></div>
  </section>
  <section id="end" class="scr">
    <p class="sub">Time’s up! Your score:</p>
    <div id="final">0</div><div class="sub" id="best"></div>
    <div id="log"></div>
    <div class="row"><button class="go" id="again">Play again</button><button class="ghost" id="home2">Change deck</button></div>
  </section>
</div>
<script>
function mk(icon,s){return {icon:icon,words:s.split("|").map(function(x){var p=x.split(":");return [p[0].trim(),p[1]||icon]})}}
var DECKS={
 "Anime":mk("🍥","Naruto|Goku|Luffy|Sasuke|Sakura|Kakashi|Itachi|Madara|Vegeta|Gojo|Tanjiro|Nezuko|Zenitsu|Inosuke|Eren|Mikasa|Armin|Levi|Light|L|Deku|Bakugo|Todoroki|All Might|Gon|Killua|Hisoka|Ash|Pikachu|Shinji|Asuka|Spike|Faye|Edward|Alphonse|Kirito|Asuna|Rimuru|Ainz|Denji|Power|Makima|Frieren|Fern|Stark|Sung Jinwoo|Solo Leveling|Ichigo|Rukia|Kenpachi|Zoro"),
 "Cartoons":mk("📺","Mickey Mouse|Bugs Bunny|Homer Simpson|Bart Simpson|SpongeBob|Patrick Star|Squidward|Tom Cat|Jerry Mouse|Scooby-Doo|Shaggy Rogers|Donald Duck|Goofy|Minnie Mouse|Daffy Duck|Popeye|Pink Panther|Garfield|Snoopy|Charlie Brown|Peter Griffin|Stewie Griffin|Rick Sanchez|Morty Smith|Goku|Naruto|Luffy|Pikachu|Ash Ketchum|Elsa|Anna|Olaf|Simba|Mufasa|Nemo|Dory|Shrek|Donkey|Fiona|Woody|Buzz Lightyear|Jessie|Mike Wazowski|Sulley|Lightning McQueen|Peppa Pig|Bluey|Ben Tennyson|Finn Mertens|Jake Dog"),
 "DC Heroes":mk("🦇","Batman|Superman|Wonder Woman|Flash|Aquaman|Green Lantern|Cyborg|Shazam|Robin|Batgirl|Nightwing|Supergirl|Green Arrow|Black Canary|Martian Manhunter|Hawkman|Hawkgirl|Zatanna|Constantine|Blue Beetle|Booster Gold|Static|Raven|Starfire|Beast Boy|Superboy|Power Girl|Black Lightning|Vixen|Firestorm|Atom|Plastic Man|Swamp Thing|Doctor Fate|Spectre|Huntress|Batwoman|Red Hood|Red Robin|Damian Wayne|Dick Grayson|Wally West|Barry Allen|Hal Jordan|John Stewart|Kyle Rayner|Kara Zor-El|Krypto|Steel"),
 "Marvel Heroes":mk("🕷️","Spider-Man|Iron Man|Thor|Hulk|Captain America|Black Widow|Hawkeye|Doctor Strange|Black Panther|Captain Marvel|Ant-Man|Wasp|Vision|Scarlet Witch|Falcon|Winter Soldier|Star-Lord|Gamora|Drax|Rocket|Groot|Mantis|Nebula|Daredevil|Punisher|Deadpool|Wolverine|Cyclops|Storm|Jean Grey|Rogue|Gambit|Nightcrawler|Colossus|Iceman|Beast|Professor X|Magneto|Ms Marvel|She-Hulk|Moon Knight|Shang-Chi|War Machine|Spider-Woman|Miles Morales|Gwen Stacy|Blade|Ghost Rider|Silver Surfer|Human Torch"),
 "Villains":mk("😈","Joker|Thanos|Darkseid|Lex Luthor|Green Goblin|Doctor Doom|Magneto|Loki|Venom|Carnage|Ultron|Galactus|Kang|Red Skull|Kingpin|Catwoman|Harley Quinn|Penguin|Riddler|Two-Face|Bane|Scarecrow|Poison Ivy|Black Adam|Sinestro|Brainiac|Doomsday|General Zod|Voldemort|Darth Vader|Palpatine|Sauron|Mystique|Sabretooth|Apocalypse|Dormammu|Hela|Killmonger|Mysterio|Electro|Doctor Octopus|Sandman|Kraven|Hobgoblin|Taskmaster|Deathstroke|Black Manta|Cheetah|Ares|Reverse-Flash"),
 "Football Legends":mk("⚽","Pele|Maradona|Messi|Cristiano|Cruyff|Zidane|Ronaldinho|Ronaldo|Beckham|Henry|Zlatan|Neymar|Mbappe|Haaland|Lewandowski|Modric|Iniesta|Xavi|Pirlo|Buffon|Casillas|Maldini|Beckenbauer|Platini|Van Basten|Gullit|Romario|Rivaldo|Kaka|Rooney|Gerrard|Lampard|Scholes|Shearer|Lineker|Kane|Salah|Mane|De Bruyne|Hazard|Pogba|Griezmann|Ramos|Pique|Puyol|Lahm|Neuer|Muller|Kroos|Ozil"),
 "Jobs":mk("💼","Doctor:🩺|Nurse:💉|Teacher:🍎|Engineer:⚙️|Lawyer:⚖️|Police Officer:👮|Firefighter:🚒|Soldier:🪖|Pilot:✈️|Chef:👨‍🍳|Waiter:🍽️|Cashier:💵|Farmer:🌾|Driver:🚕|Plumber:🔧|Electrician:⚡|Carpenter:🪚|Mechanic:🛠️|Cleaner:🧹|Barber:💈|Hairdresser:✂️|Tailor:🧵|Baker:🥖|Butcher:🥩|Accountant:🧮|Banker:🏦|Manager:📋|Secretary:🗂️|Salesperson:🛍️|Designer:🎨|Artist:🖌️|Musician:🎹|Actor:🎭|Singer:🎤|Writer:✍️|Journalist:📰|Photographer:📷|Programmer:💻|Web Developer:🌐|Data Analyst:📊|Scientist:🔬|Pharmacist:💊|Dentist:🦷|Veterinarian:🐕|Architect:📐|Builder:🏗️|Security Guard:🛡️|Librarian:📖|Social Worker:🤝|Counselor:💬|Pastor:⛪"),
 "Food":mk("🍽️","Pizza:🍕|Burger:🍔|Sushi:🍣|Ramen:🍜|Tacos:🌮|Pasta:🍝|Dumplings:🥟|Fried Rice:🍚|Steak:🥩|Lasagna:🍝|Curry:🍛|Biryani:🍛|Pho:🍜|Pad Thai:🍜|Shawarma:🌯|Kebab:🍢|Hot Dog:🌭|Sandwich:🥪|Salad:🥗|Soup:🍲|Pancakes:🥞|Waffles:🧇|Donuts:🍩|Ice Cream:🍦|Chocolate Cake:🍰|Cheesecake:🍰|Brownies:🍫|Cookies:🍪|Croissant:🥐|Bagel:🥯|Burrito:🌯|Quesadilla:🫓|Nachos:🧀|Spring Rolls:🥢|Noodles:🍜|Fried Chicken:🍗|Grilled Cheese:🧀|Macaroni:🧀|Spaghetti:🍝|Jollof Rice:🍚|Nshima:🍚|Kapenta:🐟|Chicken Curry:🍛|Fish and Chips:🍟|Roast Chicken:🍗|Meatballs:🧆|Samosa:🥟|Falafel:🧆|Hummus:🥙|Tofu Stir Fry:🥘"),
 "Animals":{icon:"🐾",words:[["Elephant","🐘"],["Lion","🦁"],["Monkey","🐒"],["Penguin","🐧"],["Giraffe","🦒"],["Frog","🐸"],["Snake","🐍"],["Shark","🦈"],["Horse","🐴"],["Butterfly","🦋"],["Crab","🦀"],["Owl","🦉"]]},
 "Snacks":{icon:"🍽️",words:[["Pizza","🍕"],["Banana","🍌"],["Burger","🍔"],["Ice Cream","🍦"],["Watermelon","🍉"],["Egg","🥚"],["Bread","🍞"],["Chicken","🍗"],["Cake","🎂"],["Popcorn","🍿"],["Corn","🌽"],["Carrot","🥕"]]},
 "Things":{icon:"🎒",words:[["Bicycle","🚲"],["Guitar","🎸"],["Phone","📱"],["Clock","⏰"],["Umbrella","☂️"],["Car","🚗"],["Football","⚽"],["Camera","📷"],["Book","📚"],["Key","🔑"],["Rocket","🚀"],["Light Bulb","💡"]]}
};
var $=function(id){return document.getElementById(id)};
var IOS=/iP(hone|ad|od)/.test(navigator.userAgent);
var words=[],i=0,score=0,log=[],t=60,timer=null,running=false,armed=false,cur=null,deck="";
var ROUND=60,AC=null,SOUND=true;
function sfx(k){if(!SOUND)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var seq={ok:[[660,.08],[880,.12]],pass:[[330,.1],[250,.14]],end:[[523,.12],[392,.12],[262,.25]],tick:[[600,.06]]}[k];var t0=AC.currentTime;seq.forEach(function(n,j){var o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=n[0];o.connect(g);g.connect(AC.destination);var s=t0+j*.1;g.gain.setValueAtTime(.2,s);g.gain.exponentialRampToValueAtTime(.001,s+n[1]+.05);o.start(s);o.stop(s+n[1]+.06)})}catch(e){}}
function shuffle(a){for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var x=a[k];a[k]=a[j];a[j]=x}return a}
function show(id){document.querySelectorAll(".scr").forEach(function(s){s.classList.toggle("on",s.id===id)});document.body.classList.toggle("playing",id!=="home")}
DECKS["Mixed"]={icon:"🎲",words:[].concat.apply([],Object.keys(DECKS).map(function(k){return DECKS[k].words}))};
["Mixed"].concat(Object.keys(DECKS).filter(function(k){return k!=="Mixed"})).forEach(function(n){var b=document.createElement("button");b.className="deck";b.innerHTML="<span>"+DECKS[n].icon+"</span>"+n;b.onclick=function(){start(n)};$("decks").appendChild(b)});
function showCard(){if(i>=words.length){words=shuffle(words);i=0}cur=words[i];$("pic").textContent=cur[1];var w=$("word");w.textContent=cur[0];w.style.fontSize="min(26cqh,"+(92/Math.max(cur[0].length,5))+"cqw)"}
function hud(){$("time").textContent=t;$("score").textContent=score}
function flash(ok){var s=$("stage");s.className=ok?"ok":"pass";setTimeout(function(){s.className=""},350)}
function mark(ok){if(!running)return;log.push([cur[0],ok]);if(ok)score++;flash(ok);sfx(ok?"ok":"pass");try{navigator.vibrate&&navigator.vibrate(ok?60:[30,40,30])}catch(e){}i++;showCard();hud();armed=false}
async function start(name){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
  try{if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){await DeviceMotionEvent.requestPermission()}}catch(e){}
  deck=name;words=shuffle(DECKS[name].words.slice());i=0;score=0;log=[];t=ROUND;
  $("deckname").textContent=name;$("tilt").textContent="Checking tilt…";show("ready");var c=3;$("count").textContent=c;
  var iv=setInterval(function(){c--;if(c>0){$("count").textContent=c;sfx("tick");if(c===1&&$("tilt").textContent==="Checking tilt…")$("tilt").textContent="No tilt detected. Use the buttons."}else{clearInterval(iv);go()}},1000)
}
function go(){show("game");running=true;armed=false;showCard();hud();timer=setInterval(function(){t--;hud();if(t<=0)finish()},1000)}
function finish(){running=false;clearInterval(timer);$("final").textContent=score;sfx("end");var k="hu-best-"+deck+"-"+ROUND,b=0;try{b=+localStorage.getItem(k)||0}catch(e){}var nb=score>b;if(nb){b=score;try{localStorage.setItem(k,b)}catch(e){}}$("best").textContent=(nb&&score>0?"New best: ":"Best: ")+b;
  $("log").innerHTML=log.map(function(l){return '<span class="chip '+(l[1]?"y":"n")+'">'+l[0]+"</span>"}).join("");show("end")}
window.addEventListener("devicemotion",function(e){
  var g=e.accelerationIncludingGravity;if(!g||g.z==null)return;$("tilt").textContent="Tilt sensor working";if(!running)return;
  var z=IOS?-g.z:g.z;
  if(Math.abs(z)<3){armed=true}else if(armed){if(z<-5)mark(true);else if(z>5)mark(false)}
});
window.addEventListener("keydown",function(e){if(e.key==="ArrowDown")mark(true);if(e.key==="ArrowUp")mark(false)});
$("bo").onclick=function(){mark(true)};$("bp").onclick=function(){mark(false)};
$("again").onclick=function(){start(deck)};$("home2").onclick=function(){show("home")};
document.querySelectorAll(".opt[data-t]").forEach(function(b){b.onclick=function(){ROUND=+b.dataset.t;document.querySelectorAll(".opt[data-t]").forEach(function(x){x.classList.toggle("sel",x===b)})}});
$("snd").onclick=function(){SOUND=!SOUND;this.textContent=SOUND?"Sound on":"Sound off";this.classList.toggle("sel",SOUND)};
</script>
</body>
</html>
